name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out proofable/sdk for skill parity
        uses: actions/checkout@v7
        with:
          repository: proofable/sdk
          path: sdk
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate (incl. canonical skill parity with @proofable/sdk)
        run: npm test
        env:
          PROOFABLE_SDK_SKILLS_ROOT: ${{ github.workspace }}/sdk/skills
      - run: npm pack --dry-run
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out proofable/sdk for skill parity
        uses: actions/checkout@v7
        with:
          repository: proofable/sdk
          path: sdk
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Pull-request CI proves only what this repository can prove deterministically:
      # canonical skills/ vs the bundled plugin copy. The cross-repository comparison
      # against proofable/sdk is release-time (see the Release workflow) because the
      # paired pull requests in both repositories land atomically.
      - name: Validate (canonical vs bundled plugin copy)
        run: npm test
        env:
          PROOFABLE_SDK_SKILLS_ROOT: ${{ github.workspace }}/sdk/skills
      - run: npm pack --dry-run
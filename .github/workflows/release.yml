name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'proofable/mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out proofable/sdk for skill parity
        uses: actions/checkout@v7
        with:
          repository: proofable/sdk
          path: sdk
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('tag must equal v'+p.version)"
      - name: Validate (incl. canonical skill parity with @proofable/sdk)
        run: npm test
        env:
          PROOFABLE_SDK_SKILLS_ROOT: ${{ github.workspace }}/sdk/skills
      - run: npm pack --dry-run
      - name: Publish @proofable/mcp
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping npm publish."
          else
            # Lifecycle scripts skipped: validation already ran once above (npm test).
            npm publish --ignore-scripts --access public --registry https://registry.npmjs.org
          fi
      - name: Install MCP Registry publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Publish Proofable MCP Registry card
        run: |
          set -euo pipefail
          mcp-publisher validate server.json
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
